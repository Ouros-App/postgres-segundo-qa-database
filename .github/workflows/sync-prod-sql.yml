name: Sync SQL From Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-prod-sql
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout production database repository
        uses: actions/checkout@v4
        with:
          repository: Ouros-App/postgres-segundo-prod-database
          ref: main
          path: .prod-database
          fetch-depth: 1
          persist-credentials: false

      - name: Mirror SQL and execution order
        run: |
          rsync -a --delete .prod-database/sql/ sql/
          cp .prod-database/config.yaml config.yaml
          sed -i 's/^project: postgres-segundo-prod-database$/project: postgres-segundo-qa-database/' config.yaml

      - name: Commit synchronization when production changed
        run: |
          rm -rf .prod-database
          if [ -z "$(git status --porcelain --untracked-files=all -- sql config.yaml)" ]; then
            echo "QA já está sincronizado com o prod."
            exit 0
          fi

          sync_branch="automation/sync-prod-sql"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$sync_branch"
          git add sql config.yaml
          git commit -m "chore: sincroniza SQL com prod"
          git push --force-with-lease origin "HEAD:$sync_branch"

          existing_pr="$(gh pr list --head "$sync_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr atualizado com o estado mais recente do prod."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$sync_branch" \
            --title "chore: sincroniza SQL com prod" \
            --body "Sincronização automática do SQL e da ordem de execução a partir de \`postgres-segundo-prod-database\`."
        env:
          GH_TOKEN: ${{ github.token }}
