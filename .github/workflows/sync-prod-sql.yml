name: Sync SQL From Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-prod-sql
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}

      - name: Checkout production database repository
        uses: actions/checkout@v4
        with:
          repository: Ouros-App/postgres-segundo-prod-database
          ref: main
          path: .prod-database
          fetch-depth: 1
          persist-credentials: false

      - name: Check whether SQL changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          cp .prod-database/config.yaml /tmp/prod-config.yaml
          sed -i 's/^project: postgres-segundo-prod-database$/project: postgres-segundo-qa-database/' /tmp/prod-config.yaml

          sql_changed=false
          config_changed=false

          if ! diff -qr .prod-database/sql sql >/dev/null; then
            sql_changed=true
          fi

          if ! cmp -s /tmp/prod-config.yaml config.yaml; then
            config_changed=true
          fi

          if [ "$sql_changed" = false ] && [ "$config_changed" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "QA já está sincronizado com o prod; nenhuma escrita será feita."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Mudanças detectadas; sincronização será executada."

      - name: Mirror SQL and execution order
        if: steps.changes.outputs.changed == 'true'
        run: |
          rsync -a --delete .prod-database/sql/ sql/
          cp /tmp/prod-config.yaml config.yaml

      - name: Commit synchronization to main
        if: steps.changes.outputs.changed == 'true'
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          rm -rf .prod-database

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql config.yaml
          git commit -m "chore: sincroniza SQL com prod"

          git remote set-url origin "https://x-access-token:${SYNC_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
