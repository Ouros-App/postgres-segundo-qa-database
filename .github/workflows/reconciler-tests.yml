name: Reconciler Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config.yaml"
      - "reconcile.yaml"
      - "requirements.txt"
      - ".github/workflows/reconciler-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config.yaml"
      - "reconcile.yaml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  reconciler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile reconciliation engine
        run: python -m compileall -q scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
