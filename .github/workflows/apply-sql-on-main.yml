name: Reconcile SQL On Main

on:
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "config.yaml"
      - "reconcile.yaml"
      - "upstream.lock"
      - "scripts/apply_sql.py"
      - "scripts/reconcile_sql.py"
      - "scripts/reconcile/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-sql-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconcile production SQL contract with QA
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_ROOT_DB: ${{ secrets.POSTGRES_ROOT_DB }}
          POSTGRES_ROOT_USER: ${{ secrets.POSTGRES_ROOT_USER }}
          POSTGRES_ROOT_PASSWORD: ${{ secrets.POSTGRES_ROOT_PASSWORD }}
          ANALYTICS_SYNC_PASSWORD: ${{ secrets.ANALYTICS_SYNC_PASSWORD }}
          MS_AUTH_SERVICE_PASSWORD: ${{ secrets.MS_AUTH_SERVICE_PASSWORD }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/reconcile_sql.py
